<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le Salon des Maires 2026 — Kevin Combe</title>
  <link rel="icon" href="favicon.ico">
  <style>
    :root{ 
      --bg:#070707; 
      --text:rgba(255,255,255,.92); 
      --muted:rgba(255,255,255,.70); 
      --max:760px; 
      --r:18px;
      --line:rgba(255,255,255,.12);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    }
    .bar{
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 18px;
      background:rgba(7,7,7,.88);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,.10);
      font-size:.85rem;
    }
    .bar a{color:var(--text);text-decoration:none;letter-spacing:.2px}
    .bar span{color:var(--muted)}
    
    main{
      width:min(var(--max),100%);
      margin:0 auto;
      padding:16px 12px 50px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
    }

    .imgFrame{
      position:relative;
      border-radius:var(--r);
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      overflow:hidden;
      box-shadow:0 18px 50px rgba(0,0,0,.55);
    }

    .page img{
      display:block;
      width:100%;
      height:auto;
      pointer-events:none;
      -webkit-user-drag:none;
      user-select:none;
    }

    footer{text-align:center;color:var(--muted);font-size:.78rem;padding:0 18px 40px}
    @media print{html,body{display:none!important}}
  </style>
</head>
<body>
  <div class="bar">
    <a href="index.html">← Retour</a>
    <span id="n">1 / 6</span>
  </div>

  <main>
    <div class="grid">
      <div class="imgFrame page"><img src="previews/salon-des-maires-page-1.jpg" alt="Page 1" draggable="false"></div>
      <div class="imgFrame page"><img src="previews/salon-des-maires-page-2.jpg" alt="Page 2" draggable="false" loading="lazy"></div>
      <div class="imgFrame page"><img src="previews/salon-des-maires-page-3.jpg" alt="Page 3" draggable="false" loading="lazy"></div>
      <div class="imgFrame page"><img src="previews/salon-des-maires-page-4.jpg" alt="Page 4" draggable="false" loading="lazy"></div>
      <div class="imgFrame page"><img src="previews/salon-des-maires-page-5.jpg" alt="Page 5" draggable="false" loading="lazy"></div>
      <div class="imgFrame page"><img src="previews/salon-des-maires-page-6.jpg" alt="Page 6" draggable="false" loading="lazy"></div>
    </div>
  </main>

  <script>
    /* Dissuasion */
    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("dragstart", (e) => e.preventDefault());
    document.addEventListener("copy", (e) => e.preventDefault());
    document.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      const mod = e.ctrlKey || e.metaKey;
      if ((mod && ["s","p","c","u","a"].includes(k)) || e.key === "F12" || e.key === "PrintScreen") e.preventDefault();
    });

    /* Compteur de pages dynamique au scroll */
    const pages = document.querySelectorAll(".page");
    const n = document.getElementById("n");
    function upd(){
      let cur = 1;
      pages.forEach((p, i) => { 
        if (p.getBoundingClientRect().top < innerHeight / 2) cur = i + 1; 
      });
      n.textContent = cur + " / " + pages.length;
    }
    addEventListener("scroll", upd, { passive: true });
    upd();
  </script>
</body>
</html>
