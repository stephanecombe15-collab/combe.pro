<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le Salon des Maires 2026 — Kevin Combe</title>
  <link rel="icon" href="favicon.ico">
  <style>
    :root{ --bg:#070707; --text:rgba(255,255,255,.92); --muted:rgba(255,255,255,.70); --max:860px; }
    *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    .bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:rgba(7,7,7,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.10);font-size:.85rem}
    .bar a{color:var(--text);text-decoration:none;letter-spacing:.2px}
    .bar span{color:var(--muted)}
    main{width:min(var(--max),100%);margin:0 auto;padding:16px 12px 50px}
    .signature{display:block;margin:8px auto 18px;max-width:200px;width:60%;height:auto;-webkit-user-drag:none;pointer-events:none}
    .page{position:relative;margin:0 0 18px;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.10);box-shadow:0 18px 50px rgba(0,0,0,.55);background:#0b0b0b}
    .page img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
    .page::after{content:"";position:absolute;inset:0}
    footer{text-align:center;color:var(--muted);font-size:.78rem;padding:0 18px 40px}
    @media print{html,body{display:none!important}}
  </style>
</head>
<body>
  <div class="bar"><a href="index.html">← Retour</a><span id="n">1 / 6</span></div>

  <main>
    <img class="signature" src="kevin-combe-signature-white.png" alt="Kevin Combe">

    <div class="page"><img src="previews/salon-des-maires-page-1.jpg" width="1240" height="1754" alt="Page 1" draggable="false"></div>
    <div class="page"><img src="previews/salon-des-maires-page-2.jpg" width="1240" height="1754" alt="Page 2" draggable="false" loading="lazy"></div>
    <div class="page"><img src="previews/salon-des-maires-page-3.jpg" width="1240" height="1754" alt="Page 3" draggable="false" loading="lazy"></div>
    <div class="page"><img src="previews/salon-des-maires-page-4.jpg" width="1240" height="1754" alt="Page 4" draggable="false" loading="lazy"></div>
    <div class="page"><img src="previews/salon-des-maires-page-5.jpg" width="1240" height="1754" alt="Page 5" draggable="false" loading="lazy"></div>
    <div class="page"><img src="previews/salon-des-maires-page-6.jpg" width="1240" height="1754" alt="Page 6" draggable="false" loading="lazy"></div>
  </main>

  <footer>© Kevin Combe · Document protégé — reproduction interdite</footer>

  <script>
    /* Dissuasion */
    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("dragstart", (e) => e.preventDefault());
    document.addEventListener("copy", (e) => e.preventDefault());
    document.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      const mod = e.ctrlKey || e.metaKey;
      if ((mod && ["s","p","c","u","a"].includes(k)) || e.key === "F12" || e.key === "PrintScreen") e.preventDefault();
    });

    /* Compteur de pages */
    const pages = document.querySelectorAll(".page");
    const n = document.getElementById("n");
    function upd(){
      let cur = 1;
      pages.forEach((p, i) => { if (p.getBoundingClientRect().top < innerHeight / 2) cur = i + 1; });
      n.textContent = cur + " / " + pages.length;
    }
    addEventListener("scroll", upd, { passive: true });
    upd();
  </script>
</body>
</html>
